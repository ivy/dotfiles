# Standalone tmux configuration (XDG: ~/.config/tmux/tmux.conf)
# Replaces gpakosz/.tmux framework with explicit settings + tmux-sensible
# See docs/tmux.md for keybinding reference, plugin management, and troubleshooting

# ---------------------------------------------------------------------------
# Plugins
# ---------------------------------------------------------------------------
# Load tmux-sensible first — provides sane defaults we build on
run-shell ~/.config/tmux/plugins/tmux-sensible/sensible.tmux

# ---------------------------------------------------------------------------
# Terminal & Display
# ---------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,xterm-ghostty:Tc"

# Disable extended-keys to fix paste in Ghostty + neovim
# See: https://github.com/gpakosz/.tmux/issues/776
set -s extended-keys off

# ---------------------------------------------------------------------------
# Prefix
# ---------------------------------------------------------------------------
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ---------------------------------------------------------------------------
# General
# ---------------------------------------------------------------------------
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mouse on

# ---------------------------------------------------------------------------
# Vi mode + copy
# ---------------------------------------------------------------------------
setw -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel

# ---------------------------------------------------------------------------
# Smart pane switching with awareness of Vim splits
# See: https://github.com/christoomey/vim-tmux-navigator
# ---------------------------------------------------------------------------
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# ---------------------------------------------------------------------------
# Prefix-based pane navigation (fallback)
# ---------------------------------------------------------------------------
# Bindings below mirror home/dot_config/herdr/config.toml, which is the primary
# multiplexer: unmodified keys act inside the current session, shift addresses
# the session itself, and alt moves a pane rather than focusing one. A herdr
# Space is a tmux session, a herdr tab a tmux window.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Session navigation. H has no meaning for a one-dimensional session list and
# stays unbound; L is tmux's own switch-client -l, which addresses a session and
# so belongs with these, though herdr has no last-Space action to mirror it.
bind J switch-client -n
bind K switch-client -p

# swap-pane takes a directional target rather than an index, so the pane that
# currently sits that way from the active one is the one that moves. -d keeps
# focus on the pane being moved instead of handing it to the pane displaced,
# which is how herdr behaves.
bind M-h swap-pane -d -t '{left-of}'
bind M-j swap-pane -d -t '{down-of}'
bind M-k swap-pane -d -t '{up-of}'
bind M-l swap-pane -d -t '{right-of}'

# Window cycling without the prefix. The tab strip is horizontal, so it takes
# h and l, the way the vertical session list takes J and K above. prefix+n and
# prefix+p remain tmux's defaults. M-j and M-k stay free: LazyVim binds them to
# move-line-down and move-line-up, and a prefixless binding never reaches the
# editor in the pane.
bind -n M-h previous-window
bind -n M-l next-window

# Resize is a mode rather than a repeatable binding, which is what frees J and K
# above. Each resize key re-enters the table so the mode is sticky; Escape or q
# leaves it, as does any key the table does not bind.
bind R switch-client -T resize
bind -T resize h resize-pane -L 5 \; switch-client -T resize
bind -T resize j resize-pane -D 5 \; switch-client -T resize
bind -T resize k resize-pane -U 5 \; switch-client -T resize
bind -T resize l resize-pane -R 5 \; switch-client -T resize
bind -T resize Escape switch-client -T root
bind -T resize q switch-client -T root

# ---------------------------------------------------------------------------
# Utility bindings
# ---------------------------------------------------------------------------
# Clear terminal
bind-key C-l send-keys C-l \; clear-history

# Split panes (preserve PWD)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window (preserve PWD)
bind c new-window -c "#{pane_current_path}"

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Quick window switcher with mouse support (mobile-friendly)
bind w choose-tree -Zw

# Open Claude Code in chezmoi directory
bind e run-shell 'tmux new-window -c "$(chezmoi data | jq -r .chezmoi.workingTree)" -n "dotfiles" "claude"'

# Open Claude Code in Obsidian vault (path from chezmoi data — never committed)
bind v run-shell 'tmux split-window -h -c "$(chezmoi data | jq -r .obsidian.vault_path)" "claude"'

# ---------------------------------------------------------------------------
# Pane styling (Catppuccin — appearance-aware)
# ---------------------------------------------------------------------------
# Active border: Lavender | Inactive border: Overlay 0
# Active pane bg: Base | Inactive pane bg: Mantle
set -g pane-border-status top
set -g pane-border-format " #{pane_title} "
run-shell ~/.local/libexec/dotfiles/tmux-apply-theme
set-hook -g client-focus-in 'run-shell -b ~/.local/libexec/dotfiles/tmux-apply-theme'

# ---------------------------------------------------------------------------
# Powerline status bar
# ---------------------------------------------------------------------------
run-shell ~/.config/tmux/plugins/tmux-powerline/main.tmux
