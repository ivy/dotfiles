# Mise tool configuration for user environment
# See docs/package-management.md for adding/updating packages
#
# Backend priority (prefer earlier options):
#   1. Native mise tools (runtimes like python, node)
#   2. github: - direct from GitHub Releases (see ADR-005)
#   3. cargo: - Rust tools built from source
#   4. pipx: - Python CLI tools (requires python)
#   5. npm: - Node CLI tools (requires node)

# Older releases cannot install from these lockfiles.
min_version = "2026.10.25"

[settings]
color_theme = "catppuccin"
lockfile = true

# Every cargo runs through mbx (github:jdx/mr-boxington below), which keeps
# target/ in a shared, garbage-collected store under ~/.cache/mbx. A config
# wrapper rather than rust's mr_boxington option: that option rides on one rust
# entry, so a project that pins its own rust silently drops it. mbx still runs
# the cargo of whichever rust the project selects.
# https://mise.jdx.dev/dev-tools/shims.html#command-wrappers
[wrappers.cargo]
command = "mbx"
env = { MBX_CARGO_SHIM_MODE = "1" }

[tools]
# Runtimes (install first - required by pipx/npm/cargo backends)
node = "26.13.1"
python = "3.15.2"
pkl = "0.33.0"
rust = "1.100.0"
bun = "1.4.4"

# Cargo (Rust tools built from source)
"cargo:https://github.com/technicalpickles/envsense" = "tag:0.6.0"
# tokei v14 has no prebuilt binaries; `features` forces cargo install (skips binstall)
"cargo:tokei" = { version = "15.0.0", features = "cli" }
# eza publishes no darwin release asset; aqua's own registry falls back to the
# crate on macOS, so build from source on both platforms instead
"cargo:eza" = "0.23.5"

# aqua: until github: backend works (github.com/bootandy/dust/issues/560)
"aqua:bootandy/dust" = "1.2.7"

# conda: poppler publishes source tarballs only. Provides pdftoppm, which
# Claude Code's Read tool needs to render PDF page ranges.
"conda:poppler" = "26.09.0"

# CLI tools (GitHub Releases - see ADR-005)
# Avoid aqua: backend — registry lag and attestation mismatches break installs.
# See docs/adrs/005-replace-aqua-backend-with-github-releases.md
"github:BurntSushi/ripgrep" = "15.2.0"
# codebase-memory-mcp: code knowledge graph over ~/src — see docs/adrs/008.
# Releases ship a `-ui-` variant alongside the plain archive; the github: backend
# picks the right one unaided and verifies the release's artifact attestations,
# which none of the upstream installers do.
"github:DeusData/codebase-memory-mcp" = "0.12.1"
"github:ajeetdsouza/zoxide" = { version = "0.10.0", platforms.linux-arm64 = { asset_pattern = "zoxide-*-aarch64-unknown-linux-musl.tar.gz" } }
# btop: upstream ships Linux binaries only; macOS gets it from Homebrew (packages.yaml)
"github:aristocratos/btop" = { version = "1.4.8", os = ["linux"] }
"github:atuinsh/atuin" = "18.24.8"
# plannotator: binary the plannotator Claude Code plugin's hooks invoke on PATH
"github:backnotprop/plannotator" = "0.28.66"
"github:boyter/scc" = "4.1.0"
"github:buildkite/cli" = "3.68.0"
"github:carapace-sh/carapace-bin" = "1.8.2"
"github:charmbracelet/glow" = "3.0.0"
"github:cli/cli" = "2.104.0"
# 7-Zip proper (7zz): extracts RAR, which the p7zip in Fedora's repos cannot
"github:ip7z/7zip" = "26.06"
"github:technicalpickles/cq" = "0.11.2"
"github:dandavison/delta" = "0.20.1"
"github:dlvhdr/gh-dash" = "4.26.3"
"github:gitleaks/gitleaks" = "8.30.1"
# herdr: persistent runtime for agent terminal sessions. The mise registry still
# points at the pre-transfer owner (ogulcancelik/herdr) — pin the canonical repo.
"github:herdrdev/herdr" = "0.9.5"
"github:jesseduffield/lazygit" = "0.66.3"
"github:jqlang/jq" = "jq-1.8.2"
"github:jdx/hk" = "2.14.0"
"github:jdx/mr-boxington" = "1.30.0"
"github:junegunn/fzf" = "0.75.0"
"github:librespeed/speedtest-cli" = "1.0.14"
"github:lima-vm/lima" = "2.3.0"
"github:mikefarah/yq" = "4.54.3"
"github:muesli/duf" = "0.9.1"
"github:neovim/neovim" = "0.12.6"
"github:sharkdp/bat" = "0.26.1"
"github:sharkdp/fd" = "10.5.2"
"github:smtg-ai/claude-squad" = "1.0.20"
"github:sst/opencode" = "2.3.0"
"github:starship/starship" = "1.27.0"
# skift: agent-first project management on a DAG. The skift@skift Claude Code
# plugin (claude-extensions.yaml) runs this binary as its MCP server.
"github:steading-ai/skift" = "0.4.0-rc.2"
"github:yt-dlp/yt-dlp" = { version = "2026.10.26", rename_exe = "yt-dlp" }
# glab: GitLab CLI. Ships releases on gitlab.com, not GitHub — the gitlab: backend
# (not aqua:) is the appropriate fetcher here, unrelated to ADR-005's aqua concerns.
"gitlab:gitlab-org/cli" = "1.131.0"

# pipx itself (prerequisite for any `pipx:` backend entries)
pipx = "1.18.16"

# Node tools via npm
"npm:@openai/codex" = "0.169.0"
"npm:@playwright/mcp" = "0.0.85"
"npm:@owloops/claude-powerline" = "1.32.8"
"npm:@tobilu/qmd" = "2.8.3"
"npm:bktide" = "1.0.1782920867"
"npm:ccusage" = "20.0.51"
"npm:git-mob" = "4.0.1"
"npm:obsidian-headless" = "0.0.14"

# moshi-hook: host daemon for the Moshi mobile terminal (https://getmoshi.app).
# Releases are published only to Moshi's CDN, so the http: backend fetches them.
#
# "latest" is the one deliberate exception to exact pins here: mise.lock holds
# the exact version and its checksums. Renovate's mise manager skips http:
# tools, but its lock file maintenance runs `mise lock --bump`, which resolves
# "latest" through version_list_url and advances the lock. An exact pin in this
# file would need a Renovate regex manager instead, and its PRs would change the
# version without the lockfile, which MISE_LOCKED installs then refuse.
#
# The daemon's own self-updater is turned off by
# run_onchange_before_20-configure-moshi-hook.sh.tmpl; left on, it would
# overwrite this install in place.
[tools."http:moshi-hook"]
version = "latest"
# Linux and macOS only: Windows releases ship as .zip under another name.
os = ["linux", "macos"]
url = 'https://cdn.getmoshi.app/hook/v{{ version }}/moshi-hook_{{ os(linux="Linux", macos="Darwin") }}_{{ arch(x64="x86_64") }}.tar.gz'
checksum_url = "https://cdn.getmoshi.app/hook/v{{ version }}/checksums.txt"
version_list_url = "https://cdn.getmoshi.app/hook/latest/version.txt"
