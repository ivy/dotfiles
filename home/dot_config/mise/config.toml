# Mise tool configuration for user environment
# See docs/package-management.md for adding/updating packages
#
# Backend priority (prefer earlier options):
#   1. Native mise tools (runtimes like python, node)
#   2. github: - direct from GitHub Releases (see ADR-005)
#   3. cargo: - Rust tools built from source
#   4. pipx: - Python CLI tools (requires python)
#   5. npm: - Node CLI tools (requires node)

# Older releases cannot install from these lockfiles.
min_version = "2026.10.1"

[settings]
color_theme = "catppuccin"
lockfile = true

[tools]
# Runtimes (install first - required by pipx/npm/cargo backends)
node = "26.10.0"
python = "3.14.8"
pkl = "0.32.1"
rust = "1.99.0"
bun = "1.4.2"

# Cargo (Rust tools built from source)
"cargo:https://github.com/technicalpickles/envsense" = "tag:0.6.0"
# tokei v14 has no prebuilt binaries; `features` forces cargo install (skips binstall)
"cargo:tokei" = { version = "15.0.0", features = "cli" }
# eza publishes no darwin release asset; aqua's own registry falls back to the
# crate on macOS, so build from source on both platforms instead
"cargo:eza" = "0.23.5"

# aqua: until github: backend works (github.com/bootandy/dust/issues/560)
"aqua:bootandy/dust" = "1.2.6"

# CLI tools (GitHub Releases - see ADR-005)
# Avoid aqua: backend — registry lag and attestation mismatches break installs.
# See docs/adrs/005-replace-aqua-backend-with-github-releases.md
"github:BurntSushi/ripgrep" = "15.2.0"
# codebase-memory-mcp: code knowledge graph over ~/src — see docs/adrs/008.
# Releases ship a `-ui-` variant alongside the plain archive; the github: backend
# picks the right one unaided and verifies the release's artifact attestations,
# which none of the upstream installers do.
"github:DeusData/codebase-memory-mcp" = "0.11.0"
"github:ajeetdsouza/zoxide" = { version = "0.10.0", platforms.linux-arm64 = { asset_pattern = "zoxide-*-aarch64-unknown-linux-musl.tar.gz" } }
# btop: upstream ships Linux binaries only; macOS gets it from Homebrew (packages.yaml)
"github:aristocratos/btop" = { version = "1.4.7", os = ["linux"] }
"github:atuinsh/atuin" = "18.23.0"
# plannotator: binary the plannotator Claude Code plugin's hooks invoke on PATH
"github:backnotprop/plannotator" = "0.27.23"
"github:boyter/scc" = "4.1.0"
"github:buildkite/cli" = "3.59.1"
"github:carapace-sh/carapace-bin" = "1.8.0"
"github:charmbracelet/glow" = "3.0.0"
"github:cli/cli" = "2.102.0"
"github:technicalpickles/cq" = "0.9.1"
"github:dandavison/delta" = "0.19.2"
"github:dlvhdr/gh-dash" = "4.26.0"
"github:gitleaks/gitleaks" = "8.30.1"
# herdr: persistent runtime for agent terminal sessions. The mise registry still
# points at the pre-transfer owner (ogulcancelik/herdr) — pin the canonical repo.
"github:herdrdev/herdr" = "0.9.3"
"github:jesseduffield/lazygit" = "0.65.1"
"github:jqlang/jq" = "jq-1.8.2"
"github:jdx/hk" = "2.4.0"
"github:junegunn/fzf" = "0.74.4"
"github:librespeed/speedtest-cli" = "1.0.14"
"github:lima-vm/lima" = "2.2.0"
"github:mikefarah/yq" = "4.54.1"
"github:muesli/duf" = "0.9.1"
"github:neovim/neovim" = "0.12.5"
"github:sharkdp/bat" = "0.26.1"
"github:sharkdp/fd" = "10.5.0"
"github:smtg-ai/claude-squad" = "1.0.20"
"github:sst/opencode" = "1.18.34"
"github:starship/starship" = "1.26.0"
"github:yt-dlp/yt-dlp" = { version = "2026.08.19", rename_exe = "yt-dlp" }
# glab: GitLab CLI. Ships releases on gitlab.com, not GitHub — the gitlab: backend
# (not aqua:) is the appropriate fetcher here, unrelated to ADR-005's aqua concerns.
"gitlab:gitlab-org/cli" = "1.120.0"

# pipx itself (prerequisite for any `pipx:` backend entries)
pipx = "1.17.8"

# Node tools via npm
"npm:@openai/codex" = "0.159.3"
"npm:@playwright/mcp" = "0.0.83"
"npm:@owloops/claude-powerline" = "1.32.1"
"npm:@tobilu/qmd" = "2.8.3"
"npm:bktide" = "1.0.1782920867"
"npm:ccusage" = "20.0.26"
"npm:git-mob" = "4.0.1"
"npm:obsidian-headless" = "0.0.14"
