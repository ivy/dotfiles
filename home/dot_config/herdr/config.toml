# herdr configuration (XDG: ~/.config/herdr/config.toml)
# Keybindings and theme mirror home/dot_config/tmux/tmux.conf so muscle memory
# carries between the two. Only settings that differ from herdr's defaults, or
# that pin a tmux mapping worth locking, appear here.
#
# Validate:  herdr config check
# Reload:    herdr server reload-config
#
# herdr writes to this file itself — the onboarding flow and manual theme
# selection in Settings both persist here. Expect chezmoi drift after either.

# Onboarding is done; skip the first-run flow so herdr has no reason to rewrite
# this file on launch.
onboarding = false

[theme]
# Catppuccin Mocha when the terminal reports dark, Latte when it reports light —
# the pairing home/dot_local/libexec/dotfiles/tmux-apply-theme applies to tmux
# pane styling.
name = "catppuccin"
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"
# Both accent overrides — theme.custom.accent and the older ui.accent — are
# deliberately unset. Each takes one static value, applied on top of whichever
# flavor auto_switch resolves to, and the Lavender tmux draws its active border
# in differs per appearance (#b4befe mocha, #7287fd latte). Either override
# would therefore be wrong in one flavor; the built-in themes accent with Blue,
# which reads correctly in both.

[terminal]
# tmux passes -c "#{pane_current_path}" on every split and new-window.
new_cwd = "follow"

[keys]
# tmux: set -g prefix C-a
# Pressing the prefix twice sends a literal ctrl+a through to the pane, which is
# what `bind C-a send-prefix` does in tmux.
prefix = "ctrl+a"

# tmux: bind <n> select-window. herdr's Spaces sit above tabs, and prefix+1..9
# already selects tabs, so Spaces take the shifted number row in sidebar order:
# prefix+! is Space 1, prefix+@ is Space 2, and so on.
switch_workspace = "prefix+shift+1..9"

# tmux: bind , rename-window   (a tmux window is a herdr tab)
#       bind $ rename-session  (a tmux session is a herdr Space)
# prefix+$ is unavailable for the Space rename because the shifted number row
# already switches Spaces above, so shift+comma sits next to the tab rename
# instead. rename_pane keeps herdr's prefix+shift+p default — tmux ships no
# pane-rename binding, so there is no muscle memory to mirror.
rename_tab = "prefix+,"
rename_workspace = "prefix+<"

# tmux: bind | split-window -h   (side by side)
#       bind - split-window -v   (stacked)
# herdr names these after the resulting layout rather than tmux's -h/-v flags:
# split_vertical puts the new pane to the right, split_horizontal below.
# prefix+\ covers terminals that report | as shift+backslash.
split_vertical = ["prefix+|", 'prefix+\']
split_horizontal = "prefix+minus"

# tmux: bind h/j/k/l select-pane. tmux.conf also binds these prefixless, which
# lives in the navigator entries under [[keys.command]] below. These stay bound
# as the fallback that works no matter what the pane is running.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# tmux: bind r source-file. herdr ships prefix+r as resize mode, so the two trade
# places. tmux's repeatable prefix+H/J/K/L resize has no 0.8.0 equivalent — enter
# resize mode, then use h/j/k/l.
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

# tmux: setw -g mode-keys vi. herdr's copy mode is already vi-keyed — h/j/k/l,
# w/b/e, v to start a selection, y to yank, / to search, q to leave.
copy_mode = "prefix+["

# tmux: prefix+d detaches. herdr defaults to prefix+q, which means "display pane
# numbers" to tmux hands.
detach = "prefix+d"

# Freed up so prefix+e can launch claude, below.
edit_scrollback = "prefix+shift+e"

# tmux: bind e / bind v open Claude Code in the dotfiles repo and the Obsidian
# vault. Both paths come from chezmoi at runtime so the vault location stays out
# of the repo. A type = "pane" command closes when the process exits, the same
# way the tmux window and split it replaces do.
[[keys.command]]
key = "prefix+e"
type = "pane"
command = 'cd "$(chezmoi data | jq -r .chezmoi.workingTree)" && exec claude'
description = "claude — dotfiles"

[[keys.command]]
key = "prefix+v"
type = "pane"
command = 'cd "$(chezmoi data | jq -r .obsidian.vault_path)" && exec claude'
description = "claude — vault"

# tmux: bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
# herdr forwards nothing conditionally, so herdr-navigate makes that call per
# keypress: forward the key when the focused pane runs an editor, move focus
# otherwise. Neovim's half of the handoff — move between splits first, ask
# herdr only at the edge — is in
# home/dot_config/nvim/lua/plugins/tmux-navigator.lua.
[[keys.command]]
key = "ctrl+h"
type = "shell"
command = '"$HOME/.local/libexec/dotfiles/herdr-navigate" left'
description = "focus left, or ctrl+h to an editor"

[[keys.command]]
key = "ctrl+j"
type = "shell"
command = '"$HOME/.local/libexec/dotfiles/herdr-navigate" down'
description = "focus down, or ctrl+j to an editor"

[[keys.command]]
key = "ctrl+k"
type = "shell"
command = '"$HOME/.local/libexec/dotfiles/herdr-navigate" up'
description = "focus up, or ctrl+k to an editor"

[[keys.command]]
key = "ctrl+l"
type = "shell"
command = '"$HOME/.local/libexec/dotfiles/herdr-navigate" right'
description = "focus right, or ctrl+l to an editor"

# tmux: bind C-l send-keys C-l \; clear-history. The navigator owns bare
# ctrl+l now, so clearing takes the prefix. Only the screen clears — herdr
# exposes no clear-history equivalent, so the scrollback survives.
[[keys.command]]
key = "prefix+ctrl+l"
type = "shell"
command = '"${HERDR_BIN_PATH:-herdr}" pane send-keys "$HERDR_ACTIVE_PANE_ID" ctrl+l'
description = "clear the focused pane"

[ui]
# tmux: bind c creates the window immediately rather than prompting for a name.
prompt_new_tab_name = false

# tmux: set -g pane-border-status top with #{pane_title} in the border.
show_agent_labels_on_pane_borders = true

[ui.toast]
# The tmux-powerline notification rail's counterpart: say something in-app when a
# background agent finishes or blocks.
delivery = "herdr"

[ui.sound]
# Claude Code hooks already play Minecraft sounds on these transitions.
# Uncomment to silence herdr's own notification sounds instead of stacking them.
# enabled = false
