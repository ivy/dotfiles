# mise configuration for chezmoi dotfiles project
# Development tools for shell scripting and testing

[settings]
# Same choice as home/dot_config/mise/config.toml, so npm: tools install the
# same way whether or not the user config is applied.
npm.package_manager = "npm"

[tools]
"aqua:bats-core/bats-core" = "1.14.0"
"aqua:boyter/scc" = "4.1.0"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mikefarah/yq" = "4.54.1"
"aqua:suzuki-shunsuke/ghalint" = "1.5.6"
"github:buildkite/cli" = "3.59.1"
"github:gitleaks/gitleaks" = "8.30.1"
"github:jdx/hk" = "2.4.0"
jq = "1.8.2"
"npm:markdownlint-cli" = "0.49.1"
pkl = "0.32.1"
shfmt = "3.14.1"
stylua = "2.5.2"

[tasks.lint]
description = "Lint and auto-fix"
run = "hk fix"

[tasks.test]
description = "Run test suite"
run = "bats test/"
