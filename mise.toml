# mise configuration for chezmoi dotfiles project
# Development tools for shell scripting and testing

# Older releases cannot install from these lockfiles.
min_version = "2026.10.25"

[tools]
"aqua:bats-core/bats-core" = "1.14.0"
"aqua:boyter/scc" = "4.1.0"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:mikefarah/yq" = "4.54.3"
"aqua:jdx/jactionlint" = "2.6.0"
"github:buildkite/cli" = "3.68.0"
"github:gitleaks/gitleaks" = "8.30.1"
"github:jdx/hk" = "2.12.0"
jq = "1.8.2"
"npm:markdownlint-cli" = "0.50.0"
# Runs the npm: tools in this file; Renovate needs a newer Node than CI
# runners ship.
node = "26.13.1"
pkl = "0.33.0"
shfmt = "3.14.1"
stylua = "2.6.0"

# renovate-config-validator for renovate.json5. @yarnpkg/libzip@3.2.2 was
# published by hand without the provenance 3.2.0 and 3.2.1 carry
# (https://github.com/yarnpkg/berry/issues/7182); drop the exclusion once
# Renovate depends on a release that has it again. bin/build-re2 compiles the
# RE2 engine Renovate validates regexes with.
[tools."npm:renovate"]
version = "44.247.2"
trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"]
depends = ["node"]
postinstall = "{{config_root}}/bin/build-re2"

[tasks.lint]
description = "Lint and auto-fix"
run = "hk fix"

[tasks.test]
description = "Run test suite"
run = "bats test/"
