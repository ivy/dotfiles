name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.2 # mise
      - name: Run linting checks
        run: hk check

  test:
    runs-on: ${{ matrix.os }}
    # A cold install of every tool takes 6-10 minutes on its own.
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest] # macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.10.2 # mise
      - name: Install chezmoi
        env:
          GIT_USER_NAME: CI Test User
          GIT_USER_EMAIL: ci@example.com
          USE_BEDROCK: "false"
          CODEX_OP_REF: op://ci/codex/credential
          CLAUDE_API_OP_REF: op://ci/claude/credential
          BUILDKITE_OP_REF: op://ci/buildkite/credential
          NGROK_OP_REF: op://ci/ngrok/credential
          OBSIDIAN_VAULT_PATH: /tmp/vault
          GITHUB_TOKEN: ${{ github.token }}
        # --no-tty turns an unanswered prompt into an immediate error rather
        # than a hang that burns the job timeout.
        run: ./install.sh -- --no-tty
      - name: Install test dependencies
        run: |
          ./bin/setup
      - name: Run test suite
        run: |
          ./bin/test
