name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Run linting checks
        run: hk check

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest] # macos-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Setup mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
      - name: Install chezmoi
        env:
          GIT_USER_NAME: CI Test User
          GIT_USER_EMAIL: ci@example.com
          USE_BEDROCK: "false"
          CODEX_OP_REF: op://ci/codex/credential
          CLAUDE_API_OP_REF: op://ci/claude/credential
          BUILDKITE_OP_REF: op://ci/buildkite/credential
          NGROK_OP_REF: op://ci/ngrok/credential
          OBSIDIAN_VAULT_PATH: /tmp/vault
        # --no-tty turns an unanswered prompt into an immediate error rather
        # than a hang that burns the job timeout.
        run: ./install.sh -- --no-tty
      - name: Install test dependencies
        run: |
          ./bin/setup
      - name: Run test suite
        run: |
          ./bin/test
